name: Publish web version

# Publishes Neon Bastion (www/) to GitHub Pages, with Last Stop Diner
# (diner/www/) under /diner/, so both can be played in any browser.
# The Mint Condition card showcase (mint-condition-site/) is under /mint-condition/,
# and the game itself (mint/www/) is under /mint-condition/play/.
# Pixel Pet Clinic (clinic/www/) is under /pet-clinic/.

on:
  push:
    branches: ['**']
    paths: ['www/**', 'diner/www/**', 'mint-condition-site/**', 'mint/www/**', 'clinic/www/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site/diner _site/mint-condition/play _site/pet-clinic
          cp -r www/. _site/
          cp -r diner/www/. _site/diner/
          cp -r mint-condition-site/. _site/mint-condition/
          cp -r mint/www/. _site/mint-condition/play/
          cp -r clinic/www/. _site/pet-clinic/
      - name: Stamp Mint Condition's version on its file addresses
        # Phones cache the game's scripts. Adding ?v=<version> to every script and stylesheet
        # address gives each release new addresses, so players get the new files right away.
        run: |
          V=$(sed -n "s/.*VERSION = '\(.*\)'.*/\1/p" mint/www/js/version.js)
          cd _site/mint-condition/play
          sed -i -E "s#(from '\./[A-Za-z0-9_-]+\.js)'#\1?v=$V'#g" js/*.js
          sed -i -E "s#src=\"js/game\.js\"#src=\"js/game.js?v=$V\"#; s#href=\"style\.css\"#href=\"style.css?v=$V\"#" index.html
          grep -q "game.js?v=$V" index.html
          echo "Stamped version $V"
      - name: Stamp Pixel Pet Clinic's version on its file addresses
        run: |
          V=$(sed -n "s/.*VERSION = '\(.*\)'.*/\1/p" clinic/www/js/version.js)
          cd _site/pet-clinic
          sed -i -E "s#(from '\./[A-Za-z0-9_-]+\.js)'#\1?v=$V'#g" js/*.js
          sed -i -E "s#src=\"js/game\.js\"#src=\"js/game.js?v=$V\"#; s#href=\"style\.css\"#href=\"style.css?v=$V\"#" index.html
          grep -q "game.js?v=$V" index.html
          echo "Stamped version $V"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
