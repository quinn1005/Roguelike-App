name: Publish web version

# Publishes Neon Bastion (www/) to GitHub Pages, with Last Stop Diner
# (diner/www/) under /diner/, so both can be played in any browser.

on:
  push:
    branches: ['**']
    paths: ['www/**', 'diner/www/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site/diner
          cp -r www/. _site/
          cp -r diner/www/. _site/diner/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
