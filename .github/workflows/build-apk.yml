name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Read version
        id: ver
        run: |
          VERSION=$(sed -n "s/.*VERSION = '\(.*\)'.*/\1/p" www/js/version.js)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (code ${{ github.run_number }})"

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons and splash screens
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#04040c' --iconBackgroundColorDark '#04040c' --splashBackgroundColor '#04040c' --splashBackgroundColorDark '#04040c'

      - name: Landscape + fullscreen
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item>\n        <item name="android:windowFullscreen">true</item>#' android/app/src/main/res/values/styles.xml
          grep -n screenOrientation android/app/src/main/AndroidManifest.xml

      - name: Set app version
        run: |
          sed -i 's/versionCode [0-9]*/versionCode ${{ github.run_number }}/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ steps.ver.outputs.version }}"/' android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Use the stable signing key (so updates install over old versions)
        run: mkdir -p ~/.android && cp keys/debug.keystore ~/.android/debug.keystore

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk neon-bastion-v${{ steps.ver.outputs.version }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: neon-bastion-v${{ steps.ver.outputs.version }}
          path: neon-bastion-v${{ steps.ver.outputs.version }}.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Neon Bastion v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: Built from ${{ github.sha }} on ${{ github.ref_name }}.
          files: neon-bastion-v${{ steps.ver.outputs.version }}.apk
