<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06040e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Last Stop Diner: feed random walk-ins, send them down the pit, cook what they bring back.">
  <title>Last Stop Diner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage" aria-label="Game view"></canvas>
  <div id="ui">
    <div id="hud" hidden>
      <div class="hud-top">
        <div class="chip" id="hud-floor"></div>
        <div class="chip gold" id="hud-loot"></div>
        <div id="rail" aria-label="Turn order"></div>
        <button class="btn sm" id="btn-mode" type="button">AUTO</button>
        <button class="btn sm" id="btn-speed" type="button">1×</button>
      </div>
      <div id="cmd" hidden></div>
      <div class="hud-bottom">
        <div class="takeouts" id="hud-takeout"></div>
        <div class="heroes" id="hud-heroes"></div>
        <div class="actions">
          <button class="btn order" id="btn-order" type="button"><span>ORDER UP</span><i id="order-fill"></i></button>
          <button class="btn bell" id="btn-bell" type="button">RING THE BELL</button>
        </div>
      </div>
    </div>
    <div id="screen"></div>
    <div id="modal" hidden></div>
    <div id="toast" hidden></div>
  </div>
  <div id="rotate"><div>Turn your phone sideways.<br><small>Last Stop Diner plays in landscape.</small></div></div>
  <script src="js/core.js"></script>
  <script src="js/data.js"></script>
  <script src="js/puppets.js"></script>
  <script src="js/render.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/cooking.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
