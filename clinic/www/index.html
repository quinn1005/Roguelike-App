<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e1214">
  <!-- The game is dark by design: tell phones not to repaint it with their own dark mode. -->
  <meta name="color-scheme" content="dark only">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Pixel Pet Clinic: diagnose and treat strange creatures in a run-down clinic. Week one demo.">
  <title>Pixel Pet Clinic</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cellipse cx='8' cy='10' rx='7' ry='5.5' fill='%2386e07c'/%3E%3Crect x='5' y='8' width='2' height='2' fill='%23161018'/%3E%3Crect x='9' y='8' width='2' height='2' fill='%23161018'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud"></header>
    <div id="stage">
      <canvas id="view" width="192" height="108"></canvas>
      <div id="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <section id="panel"></section>
  </div>
  <div id="modal" hidden><div id="modal-card" role="dialog" aria-modal="true"></div></div>
  <script type="module" src="js/game.js"></script>
</body>
</html>
